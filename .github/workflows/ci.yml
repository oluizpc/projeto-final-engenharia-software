name: CI

# Disparado a cada Pull Request: PR com pipeline vermelho nao pode ser mergeado.
on:
  pull_request:
    branches: [main]

jobs:
  test:
    name: Lint e testes
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: api-livros-docker-demo

    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt

      - name: Rodar pylint (nota minima 7.0/10)
        run: pylint --fail-under=7.0 main.py models.py repository.py exceptions.py openlibrary_client.py service.py

      - name: Rodar pytest com cobertura minima de 70%
        run: pytest --cov=. --cov-report=term-missing --cov-fail-under=70
